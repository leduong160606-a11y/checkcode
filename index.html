<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dự Án Web LightStar | AI & Gaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-main: #f0f4f8; 
            --panel-bg: #ffffff; 
            --primary: #00509e; 
            --primary-light: #007bff; 
            --accent: #ffcc00; 
            --text-main: #0a192f; 
            --text-light: #ffffff; 
            --text-muted: #64748b;
            --border-color: rgba(0, 80, 158, 0.15);
            --shadow: 0 10px 25px rgba(0, 80, 158, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            min-height: 100vh; 
            overflow-x: hidden; 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }

        #bgStarCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        #fxStarCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; pointer-events: none; }
        
        #landingScreen { 
            position: relative; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background: transparent; 
            z-index: 1000; 
            transition: opacity 0.5s ease;
            padding: 2rem 0;
            padding-bottom: 50px;
        }
        
        .lightstar-logo { 
            font-size: 4.5rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            background: linear-gradient(to right, var(--primary), var(--primary-light)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 0.5rem; 
            text-align: center; 
            position: relative;
        }
        .lightstar-logo::after {
            content: '';
            position: absolute;
            width: 100px; height: 6px;
            background: var(--accent);
            bottom: -5px; left: 50%;
            transform: translateX(-50%);
            border-radius: 10px;
        }

        .landing-header { text-align: center; margin-bottom: 4rem; position: relative; z-index: 10; }
        .path-container { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; margin-bottom: 3rem; position: relative; z-index: 10; }
        
        .path-card { 
            background: var(--panel-bg); 
            border: 2px solid var(--border-color); 
            border-radius: 24px; 
            padding: 2.5rem 2rem; 
            width: 320px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: var(--shadow); 
        }
        .path-card:hover { 
            transform: translateY(-12px); 
            border-color: var(--accent); 
            box-shadow: 0 15px 35px rgba(255, 204, 0, 0.2); 
        }
        .path-card img.game-avatar { 
            width: 80px; 
            height: 80px; 
            object-fit: cover; 
            border-radius: 50%; 
            margin-bottom: 1.5rem; 
            border: 3px solid var(--primary);
            transition: 0.3s;
        }
        .path-card:hover img.game-avatar { border-color: var(--accent); transform: scale(1.05); }

        #mainApp { display: none; flex: 1; flex-direction: column; opacity: 0; transition: opacity 0.5s ease; position: relative; z-index: 10; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--primary); border-bottom: 4px solid var(--accent); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .logo-wrap { display: flex; align-items: center; gap: 1.5rem; }
        .logo { font-weight: 800; font-size: 1.4rem; cursor: pointer; color: var(--text-light); }
        .logo i { color: var(--accent); }
        
        .btn-home-main { background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 0.5rem; }
        .btn-home-main:hover { background: var(--accent); color: var(--primary); border-color: var(--accent); }

        .nav-tabs { display: flex; gap: 0.5rem; }
        .nav-btn { padding: 0.6rem 1.2rem; border-radius: 20px; border: none; background: transparent; color: rgba(255, 255, 255, 0.7); font-weight: 600; cursor: pointer; transition: 0.3s; }
        .nav-btn.active, .nav-btn:hover { background: #fff; color: var(--primary); }

        .tab-content { display: none; max-width: 1200px; width: 100%; margin: 2rem auto; padding: 0 1.5rem; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        .card { background: var(--panel-bg); border: 1px solid var(--border-color); box-shadow: var(--shadow); border-radius: 20px; padding: 2.5rem; }
        
        input[type="text"], textarea { width: 100%; padding: 1rem; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); margin-bottom: 1.5rem; outline: none; transition: 0.3s; font-weight: 500; }
        input[type="text"]:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 80, 158, 0.1); }
        textarea { font-family: 'Fira Code', monospace; }
        
        .btn-submit { width: 100%; padding: 1.2rem; background: var(--primary); border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: var(--primary-light); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3); }
        
        .result-box { margin-top: 1.5rem; padding: 1.5rem; background: #e6f2ff; border-left: 4px solid var(--primary); border-radius: 8px; display: none; white-space: pre-wrap; font-family: 'Fira Code', monospace; color: var(--primary); }
        
        .history-item { background: var(--bg-main); border: 1px solid var(--border-color); padding: 1rem; border-radius: 10px; margin-bottom: 1rem; transition: 0.3s; }
        .history-item:hover { border-color: var(--primary); }
        .history-date { color: var(--primary); font-size: 0.85rem; margin-bottom: 0.5rem; font-weight: 700; }

        /* --- GAME HUB --- */
        .game-layout { display: flex; gap: 2rem; }
        .game-menu { flex: 1; max-width: 260px; background: var(--panel-bg); border: 1px solid var(--border-color); box-shadow: var(--shadow); border-radius: 20px; padding: 1.5rem 1rem; height: fit-content; }
        .game-menu-item { display: flex; align-items: center; gap: 1rem; padding: 1rem; border-radius: 12px; cursor: pointer; transition: 0.3s; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-muted); }
        .game-menu-item:hover, .game-menu-item.active { background: var(--primary); color: #fff; }
        
        .game-screen { flex: 3; display: flex; flex-direction: column; align-items: center; background: var(--panel-bg); box-shadow: var(--shadow); border: 1px solid var(--border-color); border-radius: 20px; padding: 2rem; }
        
        .scratch-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }
        
        #gameFullscreenContainer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .scratch-frame { width: 100%; max-width: 1000px; height: 650px; border: 4px solid var(--primary); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); background: #000; }
        
        .game-controls-row {
            display: flex;
            gap: 1rem;
            width: 100%;
            max-width: 1000px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-action { display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 1rem 1.8rem; border-radius: 12px; font-weight: 700; font-size: 1.05rem; cursor: pointer; text-decoration: none; transition: 0.3s; border: none; flex: 1; min-width: 220px; }
        
        .btn-fullscreen { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; box-shadow: 0 4px 15px rgba(0, 80, 158, 0.3); }
        .btn-fullscreen:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 80, 158, 0.4); }

        .btn-apk { background: linear-gradient(135deg, #28a745, #20c997); color: #fff; box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3); }
        .btn-apk:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(40, 167, 69, 0.4); }

        /* Kỹ thuật CSS Fullscreen thông minh: Ép khung game phủ kín màn hình điện thoại mà không bị trình duyệt chặn */
        .is-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 999999 !important;
            background: #000 !important;
            padding: 0 !important;
            margin: 0 !important;
            border-radius: 0 !important;
            justify-content: center !important;
            align-items: center !important;
        }
        .is-fullscreen .scratch-frame {
            max-width: 100% !important;
            width: 100% !important;
            height: 100vh !important;
            border: none !important;
            border-radius: 0 !important;
        }
        /* Nút thu nhỏ lại khi đang ở chế độ toàn màn hình để người dùng bấm thoát */
        .is-fullscreen .btn-exit-fs {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000000;
            background: rgba(255, 0, 0, 0.8);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .game-layout { flex-direction: column; }
            .game-menu { max-width: 100%; }
            .lightstar-logo { font-size: 2.5rem; }
            .top-nav { flex-direction: column; gap: 1rem; }
            .scratch-frame { height: 420px; max-width: 100%; }
            .game-controls-row { flex-direction: column; }
            .btn-action { width: 100%; }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <canvas id="bgStarCanvas"></canvas>
    <canvas id="fxStarCanvas"></canvas>

    <div id="landingScreen">
        <div class="landing-header">
            <h1 class="lightstar-logo">Web LightStar</h1>
            <p style="color: var(--primary); font-size: 1.1rem; font-weight: 600; margin-top: 1rem;">Hệ sinh thái Công nghệ AI & Giải trí</p>
        </div>
        
        <div class="path-container">
            <div class="path-card" onclick="enterApp('arcade')">
                <img src="https://assets.scratch.mit.edu/get_image/project/1322817368_144x108.png" alt="Shark Attack Avatar" class="game-avatar">
                <h3>Phản Xạ Cảnh Sát</h3>
                <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.5rem;">Trải nghiệm Game Phản Xạ Cảnh Sát & Tải APK</p>
            </div>
        </div>
    </div>

    <div id="mainApp">
        <nav class="top-nav">
            <div class="logo-wrap">
                <div class="logo" onclick="backToHome()"><i class="fa-solid fa-star"></i> LIGHTSTAR</div>
                <button class="btn-home-main" onclick="backToHome()"><i class="fa-solid fa-house"></i> Trang Chủ</button>
            </div>
            <div class="nav-tabs">
                <button class="nav-btn" id="navStudy" onclick="switchTab('study')"><i class="fa-solid fa-robot"></i> AI Hub</button>
                <button class="nav-btn" id="navHistory" onclick="switchTab('history')"><i class="fa-solid fa-clock-rotate-left"></i> Lịch Sử</button>
                <button class="nav-btn active" id="navArcade" onclick="switchTab('arcade')"><i class="fa-solid fa-gamepad"></i> Games</button>
            </div>
        </nav>

        <div id="studyTab" class="tab-content">
            <div class="card">
                <h2 style="color: var(--primary); margin-bottom: 1.5rem; text-align: center;"><i class="fa-solid fa-laptop-code"></i> Nộp Bài Cho AI Phân Tích</h2>
                <form id="codeForm">
                    <input type="text" id="studentName" placeholder="Tên học viên..." required>
                    <textarea id="codeContent" rows="8" placeholder="Dán mã nguồn Python/C++/JS vào đây..." required></textarea>
                    <button type="submit" id="btnSubmit" class="btn-submit"><i class="fa-solid fa-wand-magic-sparkles"></i> Chạy AI Đánh Giá</button>
                </form>
                <div id="resultBox" class="result-box"></div>
            </div>
        </div>

        <div id="historyTab" class="tab-content">
            <div class="card">
                <h2 style="color: var(--primary); margin-bottom: 1.5rem;"><i class="fa-solid fa-list-check"></i> Lịch Sử Chấm Bài</h2>
                <div id="historyList">
                    <p style="color: var(--text-muted); text-align: center; font-style: italic;">Chưa có bài nộp nào được ghi nhận.</p>
                </div>
            </div>
        </div>

        <div id="arcadeTab" class="tab-content active">
            <div class="game-layout">
                <div class="game-menu">
                    <h3 style="color: var(--primary); margin-bottom: 1rem; text-align: center; font-size: 1.1rem;">KHO GAME SCRATCH</h3>
                    <div class="game-menu-item active"><i class="fa-solid fa-gamepad"></i> <span>Phản Xạ Cảnh Sát</span></div>
                </div>

                <div class="game-screen">
                    <h2 id="gameTitle" style="color: var(--primary); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;">Phản Xạ Cảnh Sát</h2>
                    
                    <div class="scratch-wrapper">
                        <div id="gameFullscreenContainer">
                            <iframe id="scratchFrame" class="scratch-frame" src="https://scratch.mit.edu/projects/1368287353/embed" allowtransparency="true" frameborder="0" scrolling="no" allowfullscreen="true" allow="fullscreen"></iframe>
                        </div>
                        
                        <div class="game-controls-row">
                            <button class="btn-action btn-fullscreen" onclick="toggleFullscreen()">
                                <i class="fa-solid fa-expand"></i> Phóng To
                            </button>
                            <a id="downloadApkBtn" href="shark-attack.apk" class="btn-action btn-apk" download>
                                <i class="fa-brands fa-android"></i> Tải APK Android
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleFullscreen() {
            const container = document.getElementById('gameFullscreenContainer');
            
            // Sử dụng lớp CSS tùy chỉnh thay vì requestFullscreen() để tránh bị trình duyệt di động chặn
            if (!container.classList.contains('is-fullscreen')) {
                container.classList.add('is-fullscreen');
                
                // Thêm nút thoát nhanh khi ở chế độ toàn màn hình trên điện thoại
                if (!document.getElementById('exitFsBtn')) {
                    const exitBtn = document.createElement('button');
                    exitBtn.id = 'exitFsBtn';
                    exitBtn.className = 'btn-exit-fs';
                    exitBtn.innerHTML = '<i class="fa-solid fa-compress"></i> Thu Nhỏ';
                    exitBtn.onclick = toggleFullscreen;
                    container.appendChild(exitBtn);
                }
            } else {
                container.classList.remove('is-fullscreen');
                const exitBtn = document.getElementById('exitFsBtn');
                if (exitBtn) exitBtn.remove();
            }
        }

        const bgCanvas = document.getElementById('bgStarCanvas');
        const fxCanvas = document.getElementById('fxStarCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const fxCtx = fxCanvas.getContext('2d');

        let sw = window.innerWidth, sh = window.innerHeight;
        bgCanvas.width = fxCanvas.width = sw; bgCanvas.height = fxCanvas.height = sh;

        window.addEventListener('resize', () => {
            sw = window.innerWidth; sh = window.innerHeight;
            bgCanvas.width = fxCanvas.width = sw; bgCanvas.height = fxCanvas.height = sh;
        });

        function drawStarShape(ctx, x, y, spikes, outerRadius, innerRadius, rot = 0) {
            let angle = Math.PI / 2 * 3 + rot;
            let step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(x + Math.cos(angle) * outerRadius, y + Math.sin(angle) * outerRadius);
            for (let i = 0; i < spikes; i++) {
                ctx.lineTo(x + Math.cos(angle) * outerRadius, y + Math.sin(angle) * outerRadius);
                angle += step;
                ctx.lineTo(x + Math.cos(angle) * innerRadius, y + Math.sin(angle) * innerRadius);
                angle += step;
            }
            ctx.closePath();
        }

        const bgStars = [];
        for(let i=0; i<60; i++) {
            bgStars.push({
                x: Math.random() * sw, y: Math.random() * sh,
                radius: Math.random() * 2.5 + 1,
                vy: Math.random() * 1.5 + 0.5,
                color: Math.random() > 0.5 ? '#007bff' : '#ffcc00', 
                opacity: Math.random() * 0.4 + 0.1
            });
        }

        class InteractiveStar {
            constructor(x, y, vx, vy, color, size, lifeDuration, isExplosion) {
                this.x = x; this.y = y; 
                this.vx = vx; this.vy = vy;
                this.color = color; this.size = size;
                this.life = lifeDuration; this.maxLife = lifeDuration;
                this.rot = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.4;
                this.isExplosion = isExplosion;
            }
            update() {
                if (this.isExplosion) {
                    this.vy += 0.25; this.vx *= 0.96; this.vy *= 0.96;
                }
                this.x += this.vx; this.y += this.vy;
                this.rot += this.rotSpeed; this.life--; this.size *= 0.96; 
            }
            draw(ctx) {
                let alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha; ctx.fillStyle = this.color;
                ctx.shadowBlur = 12; ctx.shadowColor = this.color;
                drawStarShape(ctx, this.x, this.y, 5, this.size, this.size / 2.5, this.rot);
                ctx.fill(); ctx.restore();
            }
        }

        let fxStars = [];
        document.addEventListener('mousemove', (e) => {
            if(Math.random() > 0.1) { 
                let size = Math.random() * 6 + 3; 
                let color = Math.random() > 0.5 ? '#00d2ff' : '#ffcc00';
                fxStars.push(new InteractiveStar(e.clientX, e.clientY, (Math.random() - 0.5) * 2, Math.random() * 1.5, color, size, 35, false));
            }
        });

        document.addEventListener('click', (e) => {
            for(let i=0; i<35; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 8 + 2;
                let vx = Math.cos(angle) * speed, vy = Math.sin(angle) * speed;
                let size = Math.random() * 7 + 4;
                let color = Math.random() > 0.5 ? '#00509e' : '#ffcc00';
                fxStars.push(new InteractiveStar(e.clientX, e.clientY, vx, vy, color, size, 50, true));
            }
        });

        function animateStars() {
            bgCtx.clearRect(0, 0, sw, sh);
            bgStars.forEach(s => {
                s.y += s.vy; if(s.y > sh + 10) { s.y = -10; s.x = Math.random() * sw; }
                bgCtx.globalAlpha = s.opacity; bgCtx.fillStyle = s.color;
                drawStarShape(bgCtx, s.x, s.y, 5, s.radius, s.radius/2); bgCtx.fill();
            });

            fxCtx.clearRect(0, 0, sw, sh);
            for(let i = fxStars.length - 1; i >= 0; i--) {
                let s = fxStars[i];
                s.update();
                if(s.life <= 0 || s.size < 0.5) fxStars.splice(i, 1);
                else s.draw(fxCtx);
            }
            requestAnimationFrame(animateStars);
        }
        animateStars();

        function enterApp(tab) {
            document.getElementById('landingScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('landingScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                void document.getElementById('mainApp').offsetWidth;
                document.getElementById('mainApp').style.opacity = '1';
                switchTab(tab);
            }, 500);
        }

        function backToHome() {
            document.getElementById('mainApp').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('mainApp').style.display = 'none';
                document.getElementById('landingScreen').style.display = 'flex';
                void document.getElementById('landingScreen').offsetWidth;
                document.getElementById('landingScreen').style.opacity = '1';
            }, 500);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content, .nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId + 'Tab').classList.add('active');
            
            const btnMap = { 'study': 'navStudy', 'history': 'navHistory', 'arcade': 'navArcade' };
            if(btnMap[tabId]) document.getElementById(btnMap[tabId]).classList.add('active');
            if(tabId === 'history') renderHistory();
        }

        let historyData = [];
        document.getElementById('codeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const resultBox = document.getElementById('resultBox');
            const student_name = document.getElementById('studentName').value;
            const code_content = document.getElementById('codeContent').value;
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang Xử Lý...';
            resultBox.style.display = 'none';
            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_name, code_content })
                });
                const data = await response.json();
                resultBox.innerHTML = marked.parse(data.ai_feedback);
                resultBox.style.display = 'block';
                historyData.unshift({ date: new Date().toLocaleString(), name: student_name, code: code_content, feedback: data.ai_feedback });
            } catch (error) {
                resultBox.innerText = "⚠️ Lỗi kết nối! Hệ thống đang chạy ở chế độ Frontend Demo.";
                resultBox.style.display = 'block';
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Chạy AI Đánh Giá';
            }
        });

        function renderHistory() {
            const list = document.getElementById('historyList');
            if(historyData.length === 0) return;
            list.innerHTML = '';
            historyData.forEach(item => {
                list.innerHTML += `
                    <div class="history-item">
                        <div class="history-date"><i class="fa-solid fa-user-pen"></i> ${item.name} <span style="color:var(--text-muted); font-weight:400; font-size:0.8rem; margin-left: 10px;">${item.date}</span></div>
                        <div style="color: var(--text-main); margin-bottom: 5px; font-size: 0.95rem; font-weight: 500;">Mã nguồn: <span style="color:var(--text-muted); font-family: monospace;">${item.code.substring(0, 60)}...</span></div>
                        <div style="color: var(--primary); font-size: 0.95rem; font-weight: 500; background: #e6f2ff; padding: 10px; border-radius: 8px;">Kết quả: ${item.feedback.substring(0, 100)}...</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
